<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>My First Webpage</title>
    <link rel="stylesheet" href="./style.css"/>
  </head>

  <body>
    <div class="banner">
      <div class="text-over-banner">
	<div class="motto-container">
	  <div class="motto-icon">
            <img class="icon" src="./img/icon.png" alt="microphone icon">
	  </div>
	  <div class="motto-text">
            GO LIVE
	  </div>
	</div>
	<div class="credit">Photo by <a href="https://unsplash.com/@seitamaaphotography">Sandra Seitamaa</a> on <a href="https://unsplash.com/">Unsplash</a></div>
      </div>
    </div>
    <div class="content-container">
      <div class="appeal-container">
	<div class="pitch">
          Meet with like-minded people and discover your potential.
	</div>
	<div class="hook">
          There is no time like <em>now</em>.
	</div>
      </div>
      <div class="sign-up-form-container">
        <form action="" method="post">
          <div class="form-entry-container">
            <div class="call-to-action">
              Let's get <em>you</em> signed up.
            </div>
            <fieldset>
	      <div class="user-entry">
                <label for="first_name">FIRST NAME</label>
                <input type="text" id="first_name" name="first_name">
	      </div>
	      <div class="user-entry">
                <label for="last_name">LAST NAME</label>
                <input type="text" id="last_name" name="last_name">
              </div>
	    </fieldset>
  
            <fieldset>
	      <div class="user-entry">
                <label for="user_email">EMAIL</label>
                <input type="email" id="user_email" name="user_email">
	      </div>
	      <div class="user-entry">
                <label for="user_phone_number">PHONE NUMBER</label>
                <input type="text" id="user_phone_number" name="user_phone_number">
              </div>
	    </fieldset>
  
            <fieldset>
	      <div class="user-entry">
                <label for="user_password">PASSWORD</label>
                <input type="password" id="user_password" name="user_password" minlength="8" maxlength="20" required>
	      </div>
	      <div class="user-entry">
                <label for="user_confirm_password">CONFIRM PASSWORD</label>
                <input type="password" id="user_confirm_password" name="user_confirm_password" minlength="8" maxlength="20" required>
              </div>
	    </fieldset>
	  </div>
	  <div class="end-of-form-container">
            <div class="submit-form-button-container">
              <button type="submit">Create Account</button>
            </div>
	    <div class="existing-account">
	      Already have an account? <a href="">Log in</a>
	    </div>
          </div>
	</form>
      </div>
    </div>
  </body>
</html>
