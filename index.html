<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>My First Webpage</title>
  </head>

  <body>
    <div class="banner">
      <img src="./img/banner.jpg" alt="night life in club">
      <div class="text-over-image">
        <p>Live</p>
	<p>Photo by <a href="https://unsplash.com/@seitamaaphotography">Sandra Seitamaa</a> on <a href="https://unsplash.com/">Unsplash</a></p>
      </div>
    </div>
    <div class="content-container">
      <div class="pitch">
        Let's get you signed up.
      </div>
      <div class="sign-up-form-container">
        <form action="" method="post">
          <div class="form-entry-container">
            <fieldset>
	      <div class="user_entry">
                <label for="first_name">FIRST NAME</label>
                <input type="text" id="first_name" name="first_name">
	      </div>
	      <div class="user_entry">
                <label for="last_name">LAST NAME</label>
                <input type="text" id="last_name" name="last_name">
              </div>
	    </fieldset>
  
            <fieldset>
	      <div class="user_entry">
                <label for="user_email">EMAIL</label>
                <input type="email" id="user_email" name="user_email">
	      </div>
	      <div class="user_entry">
                <label for="user_phone_number">PHONE NUMBER</label>
                <input type="text" id="user_phone_number" name="user_phone_number">
              </div>
	    </fieldset>
  
            <fieldset>
	      <div class="user_entry">
                <label for="user_password">PASSWORD</label>
                <input type="password" id="user_password" name="user_password">
	      </div>
	      <div class="user_entry">
                <label for="user_confirm_password">CONFIRM PASSWORD</label>
                <input type="password" id="user_confirm_password" name="user_confirm_password">
              </div>
	    </fieldset>
	  </div>
	  <div class="end-of-form-container">
            <div class="submit-form-button-container">
              <button type="submit">Create Account</button>
            </div>
	    <div class="existing account">
	      Already have an account? <a href="">Log in</a>
	    </div>
          </div>
	</form>
      </div>
    </div>
  </body>
</html>
